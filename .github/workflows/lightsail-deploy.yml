name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "Starting deployment process..."

            # Non-interactive SSH won't load shell rc files; Bun lives here by default.
            export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
            export PATH="$BUN_INSTALL/bin:$PATH"

            if ! command -v bun >/dev/null 2>&1; then
              echo "bun not found at $BUN_INSTALL/bin/bun" >&2
              exit 1
            fi
            echo "Using bun: $(command -v bun) ($(bun --version))"

            APP_DIR=/var/www/sndbnk
            EXPECTED_ORIGIN=https://sndbnk.com

            echo "Changing to project directory..."
            cd "$APP_DIR"
            echo "Current directory: $(pwd)"

            echo "Pulling latest changes..."
            # .env is gitignored and must never be deleted or overwritten by pull.
            # Snapshot it, clear any tracked dirt so ff-only can apply a deletion cleanly,
            # then restore the live file before the merge script runs.
            PRE_PULL_ENV="/tmp/sndbnk.env.pre-pull"
            rm -f "$PRE_PULL_ENV"
            if [ -f .env ]; then
              cp -a .env "$PRE_PULL_ENV"
            fi
            git fetch origin main
            git checkout main
            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              # Discard local edits to the formerly tracked file so pull is not blocked.
              git checkout HEAD -- .env
            fi
            git pull --ff-only origin main
            if [ -f "$PRE_PULL_ENV" ]; then
              cp -a "$PRE_PULL_ENV" .env
            fi

            echo "Ensuring production .env values..."
            PRE_PULL_ENV="$PRE_PULL_ENV" python3 - <<'PY'
            from pathlib import Path
            import os
            import secrets

            def parse_env(path: Path):
                env = {}
                order = []
                if not path.exists():
                    return env, order
                for line in path.read_text().splitlines():
                    if not line.strip() or line.strip().startswith("#") or "=" not in line:
                        order.append(("raw", line))
                        continue
                    k, v = line.split("=", 1)
                    key = k.strip()
                    env[key] = v.strip()
                    order.append(("kv", key))
                return env, order

            def clean(value: str) -> str:
                return value.strip().strip('"').strip("'")

            def parse_as_bytes(value: str):
                """Parse adapter-style sizes (512K, 110M) into a byte count, or None if invalid."""
                raw = clean(value)
                if not raw:
                    return None
                unit = raw[-1].upper()
                multiplier = {"B": 1, "K": 1024, "M": 1024 * 1024, "G": 1024 * 1024 * 1024}.get(
                    unit, 1
                )
                number = raw[:-1] if multiplier != 1 else raw
                try:
                    parsed = float(number) * multiplier
                except ValueError:
                    return None
                if parsed != parsed:  # NaN
                    return None
                return parsed

            p = Path("/var/www/sndbnk/.env")
            env, order = parse_env(p)

            # Prefer secrets/values already live on the server before this pull.
            # Keep raw assignment text (including quotes) so SMTP passwords with
            # $, &, |, etc. round-trip without bash/systemd reinterpretation.
            preserve_keys = (
                "BETTER_AUTH_SECRET",
                "STORAGE_SECRET",
                "DATABASE_URL",
                "MEDIA_ROOT",
                "BODY_SIZE_LIMIT",
                "REDIS_URL",
                "MAIL_TRANSPORT",
                "MAIL_FROM",
                "SMTP_HOST",
                "SMTP_PORT",
                "SMTP_SECURE",
                "SMTP_USER",
                "SMTP_PASSWORD",
                "STRIPE_SECRET_KEY",
                "PUBLIC_STRIPE_PUBLISHABLE_KEY",
                "STRIPE_WEBHOOK_SECRET",
            )
            pre_pull = Path(os.environ.get("PRE_PULL_ENV", "/tmp/sndbnk.env.pre-pull"))
            if pre_pull.exists():
                prev, _ = parse_env(pre_pull)
                for key in preserve_keys:
                    prev_raw = prev.get(key, "").strip()
                    if clean(prev_raw):
                        env[key] = prev_raw
                        print(f"Preserved {key} from pre-pull .env")

            if clean(env.get("ORIGIN", "")) != "https://sndbnk.com":
                env["ORIGIN"] = "https://sndbnk.com"
                print("Updated ORIGIN -> https://sndbnk.com")
            if clean(env.get("PUBLIC_BASE_DOMAIN", "")) != "sndbnk.com":
                env["PUBLIC_BASE_DOMAIN"] = "sndbnk.com"
                print("Updated PUBLIC_BASE_DOMAIN -> sndbnk.com")
            if not clean(env.get("DATABASE_URL", "")):
                env["DATABASE_URL"] = "local.db"
                print("Set DATABASE_URL=local.db")
            if not clean(env.get("MEDIA_ROOT", "")):
                env["MEDIA_ROOT"] = "./media"
                print("Set MEDIA_ROOT=./media")
            # Default Bun/adapter body limit is 512K; library uploads allow 500MB audio + 5MB cover.
            min_body_limit = parse_as_bytes("520M")
            body_limit_bytes = parse_as_bytes(env.get("BODY_SIZE_LIMIT", ""))
            if body_limit_bytes is None or body_limit_bytes < min_body_limit:
                env["BODY_SIZE_LIMIT"] = "520M"
                print("Set BODY_SIZE_LIMIT=520M")
            if not clean(env.get("REDIS_URL", "")):
                env["REDIS_URL"] = "redis://127.0.0.1:6379"
                print("Set REDIS_URL=redis://127.0.0.1:6379")
            secret = clean(env.get("BETTER_AUTH_SECRET", ""))
            if not secret or len(secret) < 32:
                env["BETTER_AUTH_SECRET"] = secrets.token_hex(32)
                print("Generated BETTER_AUTH_SECRET")
            storage_secret = clean(env.get("STORAGE_SECRET", ""))
            if not storage_secret or len(storage_secret) < 32:
                env["STORAGE_SECRET"] = secrets.token_hex(32)
                print("Generated STORAGE_SECRET")
            env["PROTOCOL_HEADER"] = "X-Forwarded-Proto"
            env["HOST_HEADER"] = "X-Forwarded-Host"
            managed = (
                "DATABASE_URL",
                "ORIGIN",
                "PUBLIC_BASE_DOMAIN",
                "BETTER_AUTH_SECRET",
                "MEDIA_ROOT",
                "BODY_SIZE_LIMIT",
                "REDIS_URL",
                "STORAGE_SECRET",
                "PROTOCOL_HEADER",
                "HOST_HEADER",
            )
            seen = set()
            out = []
            for kind, payload in order:
                if kind == "raw":
                    out.append(payload)
                    continue
                key = payload
                if key in managed:
                    out.append(f"{key}={env[key]}")
                else:
                    out.append(f"{key}={env.get(key, '')}")
                seen.add(key)
            for key in managed:
                if key not in seen:
                    out.append(f"{key}={env[key]}")
            # Append preserved secrets that exist only on the server.
            for key in preserve_keys:
                if key not in seen and key not in managed and clean(env.get(key, "")):
                    out.append(f"{key}={env[key]}")
                    seen.add(key)
            p.write_text("\n".join(out).rstrip() + "\n")
            PY
            chmod 600 .env
            chown ubuntu:ubuntu .env || true
            mkdir -p media
            chown ubuntu:ubuntu media || true

            echo "Ensuring SQLite file ownership/permissions..."
            DB_PATH="$(
              python3 - <<'PY'
            from pathlib import Path
            env = {}
            for line in Path("/var/www/sndbnk/.env").read_text().splitlines():
                line = line.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                k, v = line.split("=", 1)
                env[k.strip()] = v.strip().strip('"').strip("'")
            print(env.get("DATABASE_URL", "local.db"))
            PY
            )"
            case "$DB_PATH" in
              /*) DB_ABS="$DB_PATH" ;;
              *) DB_ABS="$APP_DIR/$DB_PATH" ;;
            esac
            mkdir -p "$(dirname "$DB_ABS")"
            if [ ! -e "$DB_ABS" ]; then
              touch "$DB_ABS"
            fi
            sudo chown -R ubuntu:ubuntu "$APP_DIR"
            sudo chown ubuntu:ubuntu "$DB_ABS" || true
            chmod 664 "$DB_ABS" || true
            for side in "-wal" "-shm" "-journal"; do
              if [ -e "${DB_ABS}${side}" ]; then
                sudo chown ubuntu:ubuntu "${DB_ABS}${side}" || true
                chmod 664 "${DB_ABS}${side}" || true
              fi
            done

            echo "Installing/updating systemd units..."
            sudo cp "$APP_DIR/systemd.service" /etc/systemd/system/sndbnk.service
            sudo cp "$APP_DIR/systemd.waveform-worker.service" /etc/systemd/system/sndbnk-waveform-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable sndbnk sndbnk-waveform-worker >/dev/null 2>&1 || true

            # /etc/caddy/Caddyfile is a symlink into the repo. Tenant on-demand TLS
            # needs the catch-all site loaded, and Caddy refuses to reload if the
            # tenant access log path is missing or not writable by user `caddy`.
            echo "Ensuring Caddy tenant logs + reloading config..."
            sudo mkdir -p /var/log/caddy
            sudo touch /var/log/caddy/sndbnk.access.log /var/log/caddy/sndbnk-tenant.access.log
            sudo chown -R caddy:caddy /var/log/caddy
            if systemctl is-active --quiet caddy; then
              sudo systemctl reload caddy
            else
              sudo systemctl start caddy
            fi
            systemctl is-active caddy

            echo "Ensuring redis-server is available for waveform jobs..."
            if ! command -v redis-server >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server
            fi
            sudo systemctl enable --now redis-server >/dev/null 2>&1 || true
            if ! redis-cli ping >/dev/null 2>&1; then
              echo "redis-server is required for waveform jobs but did not respond to PING" >&2
              exit 1
            fi
            echo "Redis: $(redis-cli ping)"

            echo "Ensuring ffmpeg is available for waveform generation..."
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
            fi
            if ! command -v ffmpeg >/dev/null 2>&1; then
              echo "ffmpeg is required for track waveforms but was not found after install" >&2
              exit 1
            fi
            echo "Using ffmpeg: $(command -v ffmpeg) ($(ffmpeg -version | head -n 1))"

            echo "Installing dependencies..."
            bun install

            echo "Backing up SQLite before migrations..."
            # Export via Python/shlex so SMTP passwords with $, &, |, etc. stay intact.
            eval "$(
              python3 - <<'PY'
            from pathlib import Path
            import shlex

            for line in Path("/var/www/sndbnk/.env").read_text().splitlines():
                line = line.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, raw = line.split("=", 1)
                key = key.strip()
                if not key:
                    continue
                value = raw.strip().strip('"').strip("'")
                print(f"export {key}={shlex.quote(value)}")
            PY
            )"
            if [ -f "${DATABASE_URL}" ]; then
              bun run db:backup
            else
              echo "No database file yet at ${DATABASE_URL}; skipping backup"
            fi

            echo "Applying Drizzle migrations..."
            bun run db:migrate

            echo "Building the project..."
            bun run build

            echo "Restarting Bun app + waveform worker..."
            sudo systemctl restart sndbnk sndbnk-waveform-worker
            sleep 2
            systemctl is-active sndbnk
            systemctl is-active sndbnk-waveform-worker

            echo "Smoke-testing auth origin..."
            CODE="$(
              curl -sS -o /tmp/auth-smoke.body -w '%{http_code}' \
                -X POST 'http://127.0.0.1:3000/api/auth/sign-in/email' \
                -H 'content-type: application/json' \
                -H "origin: ${EXPECTED_ORIGIN}" \
                -H "host: sndbnk.com" \
                --data '{"email":"smoke-nonexistent@sndbnk.invalid","password":"not-a-real-password"}' || true
            )"
            echo "sign-in probe HTTP $CODE"
            head -c 300 /tmp/auth-smoke.body; echo
            # 401/400 means origin/baseURL accepted the request; 403 INVALID_ORIGIN is a deploy failure.
            if [ "$CODE" = "403" ] && grep -q 'INVALID_ORIGIN' /tmp/auth-smoke.body; then
              echo "Auth origin check failed" >&2
              journalctl -u sndbnk -n 50 --no-pager || true
              exit 1
            fi
            if [ "$CODE" = "500" ]; then
              echo "Auth endpoint returned 500 after deploy" >&2
              journalctl -u sndbnk -n 50 --no-pager || true
              exit 1
            fi

            echo "Smoke-testing tenant wildcard DNS..."
            # Creators need *.sndbnk.com → Lightsail. Without it, subdomains and custom-domain
            # CNAME targets never resolve even when the app and TLS ask endpoint are healthy.
            python3 - <<'PY'
            import socket
            import sys

            host = "wildcard-probe.sndbnk.com"
            try:
                infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
            except socket.gaierror as exc:
                print(
                    f"FAIL: {host} does not resolve ({exc}). "
                    "Add an A record for *.sndbnk.com pointing at this server's public IP "
                    "in the sndbnk.com Route 53 hosted zone.",
                    file=sys.stderr,
                )
                sys.exit(1)

            addrs = sorted({item[4][0] for item in infos})
            print(f"OK tenant DNS: {host} → {', '.join(addrs)}")
            PY

            echo "Deployment completed successfully"
