<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var root = document.documentElement;
					var stored = localStorage.getItem('theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';

					var accents = {
						lime: { value: '#c8ff3d', onAccent: '#11110f' },
						cyan: { value: '#3de0ff', onAccent: '#11110f' },
						magenta: { value: '#ff3d8a', onAccent: '#11110f' },
						orange: { value: '#ff8a3d', onAccent: '#11110f' }
					};
					var accent = accents[localStorage.getItem('accent')] || accents.lime;
					root.style.setProperty('--accent', accent.value);
					root.style.setProperty('--on-accent', accent.onAccent);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
